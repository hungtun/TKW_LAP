<!DOCTYPE html>
<html lang="vi">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hồ sơ cá nhân</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="profile-card">
    <img class="avatar" src="avatar.jpg" alt="Ảnh đại diện">
    <h2>Khoa Công nghệ Thông tin</h2>
    <p class="title">Trường Đại học Mở TP.HCM</p>

      <div class="stat"><strong>320</strong><span>Following</span></div>
      <div class="stat"><strong>48</strong><span>Bài viết</span></div>
    </div>

    <button class="follow-btn">Theo dõi</button>
  </div>
</body>
</html>
