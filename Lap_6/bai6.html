<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bài 6 - Sidebar</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Sidebar -->
    <aside
        class="hidden md:flex fixed
               left-0 top-0 bottom-0
               w-64 bg-gray-800
               text-white flex-col">

        <!-- Logo -->
        <div class="p-6 text-xl font-bold">
            My Dashboard
        </div>

        <!-- Menu -->
        <nav class="flex-1 px-4">

            <a href="#"
               class="flex items-center gap-3
                      px-4 py-3 rounded-lg
                      hover:bg-gray-700
                      transition">
                📊 Dashboard
            </a>

            <a href="#"
               class="flex items-center gap-3
                      px-4 py-3 rounded-lg
                      hover:bg-gray-700
                      transition">
                👤 Hồ sơ
            </a>

            <a href="#"
               class="flex items-center gap-3
                      px-4 py-3 rounded-lg
                      hover:bg-gray-700
                      transition">
                ⚙️ Cài đặt
            </a>

            <a href="#"
               class="flex items-center gap-3
                      px-4 py-3 rounded-lg
                      hover:bg-gray-700
                      transition">
                🚪 Đăng xuất
            </a>

        </nav>

    </aside>

    <!-- Nội dung -->
    <main class="md:ml-64 p-8">

        <h1 class="text-3xl font-bold mb-4">
            Nội dung chính
        </h1>

        <div class="bg-white p-6 rounded-lg shadow">
            Nội dung website nằm ở đây.
        </div>

    </main>

</body>
</html>
