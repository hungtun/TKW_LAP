<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bài 7 - Skeleton Loading</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white p-8">

    <div class="max-w-2xl mx-auto">

        <!-- Skeleton bài viết 1 -->
        <div class="border-b pb-5 mb-5">

            <div class="h-4 bg-gray-200
                        rounded animate-pulse
                        w-3/4 mb-4">
            </div>

            <div class="h-4 bg-gray-200
                        rounded animate-pulse
                        w-full mb-3">
            </div>

            <div class="h-4 bg-gray-200
                        rounded animate-pulse
                        w-1/2">
            </div>

        </div>

        <!-- Skeleton bài viết 2 -->
        <div class="border-b pb-5">

            <div class="h-4 bg-gray-200
                        rounded animate-pulse
                        w-3/4 mb-4">
            </div>

            <div class="h-4 bg-gray-200
                        rounded animate-pulse
                        w-full mb-3">
            </div>

            <div class="h-4 bg-gray-200
                        rounded animate-pulse
                        w-1/2">
            </div>

        </div>

    </div>

</body>
</html>
