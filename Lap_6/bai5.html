<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bài 5 - Form đăng ký</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen
             flex items-center justify-center p-5">

    <div class="bg-white w-full max-w-md
                p-7 rounded-lg shadow-lg">

        <h1 class="text-2xl font-bold
                   text-center text-gray-800 mb-6">
            Đăng Ký
        </h1>

        <form>

            <!-- Họ tên -->
            <div class="mb-4">

                <input
                    type="text"
                    placeholder="Họ và Tên"
                    class="w-full border border-gray-300
                           rounded-lg px-4 py-3
                           outline-none
                           focus:ring-2
                           focus:ring-blue-500">

            </div>

            <!-- Email -->
            <div class="mb-4">

                <input
                    type="email"
                    placeholder="Email"
                    class="w-full border border-gray-300
                           rounded-lg px-4 py-3
                           outline-none
                           focus:ring-2
                           focus:ring-blue-500">

            </div>

            <!-- Mật khẩu -->
            <div class="mb-5">

                <input
                    type="password"
                    placeholder="Mật khẩu"
                    class="w-full border border-gray-300
                           rounded-lg px-4 py-3
                           outline-none
                           focus:ring-2
                           focus:ring-blue-500">

            </div>

            <!-- Button -->
            <button
                type="submit"
                class="w-full bg-blue-500
                       text-white py-3 rounded-lg
                       font-semibold
                       hover:bg-blue-700
                       transition">

                Đăng ký

            </button>

        </form>

    </div>

</body>
</html>
