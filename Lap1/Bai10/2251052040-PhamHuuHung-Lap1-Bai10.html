<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Cá Nhân</title>
    <link rel="stylesheet" href="2251052040-PhamHuuHung-Lap1-Bai10.css">
</head>
<body>

    
    <input type="checkbox" id="theme-toggle" class="theme-checkbox" hidden>

    
    <div class="app-container">
        
        
        <aside class="sidebar">
            <h2 class="logo">Dashboard</h2>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">Tổng quan</a>
                <a href="#" class="nav-item">Dự án</a>
                <a href="#" class="nav-item">Thống kê</a>
                <a href="#" class="nav-item">Cài đặt</a>
            </nav>
        </aside>

        
        <header class="header">
            <div class="greeting">Xin chào, bạn .... 👋</div>
            
            <label for="theme-toggle" class="toggle-btn">
                <span class="toggle-text-light">🌙 Chế độ tối</span>
                <span class="toggle-text-dark">☀️ Chế độ sáng</span>
            </label>
        </header>

        
        <main class="main-content">
            <h1 class="page-title">Tổng Quan</h1>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value">12</div>
                    <div class="stat-label">Dự án</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">86%</div>
                    <div class="stat-label">Hoàn thành</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">5</div>
                    <div class="stat-label">Việc cần làm</div>
                </div>
            </div>

            <p class="description">Đây là bảng điều khiển cá nhân hiển thị tiến độ công việc theo thời gian thực.</p>
        </main>

        
        <footer class="footer">
            &copy; 2026 Trang cá nhân — Dashboard Demo
        </footer>
        
    </div>

</body>
</html>
