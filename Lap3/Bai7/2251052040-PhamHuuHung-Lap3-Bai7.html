<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính điểm trung bình tích lũy</title>
    <link rel="stylesheet" href="2251052040-PhamHuuHung-Lap3-Bai7.css">
</head>

<body>
    <div class="card">
        <h1>Tính điểm trung bình tích lũy</h1>

        <div class="add-section">
            <input type="text" id="subject-name" placeholder="Tên môn">
            <div class="add-row">
                <input type="number" id="credits" placeholder="Tín chỉ" min="1">
                <input type="number" id="grade" placeholder="Điểm" min="0" max="10" step="0.1">
                <button type="button" id="btn-add">Thêm môn</button>
            </div>
        </div>

        <div class="gpa-display">
            <p>Điểm trung bình tích lũy (GPA)</p>
            <p id="gpa-value" class="gpa-value">—</p>
        </div>

        <ul id="subject-list"></ul>
        <p id="empty-msg" class="empty-msg">Chưa có môn học nào.</p>
    </div>

    <script src="2251052040-PhamHuuHung-Lap3-Bai7.js"></script>
</body>

</html>
