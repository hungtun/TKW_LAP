<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bình chọn ngôn ngữ lập trình</title>
    <link rel="stylesheet" href="2251052040-PhamHuuHung-Lap3-Bai10.css">

<body>
    <div class="card">
        <h1>Ngôn ngữ lập trình yêu thích của bạn?</h1>

            </div>

            <div class="poll-item" data-lang="Python">
                <span class="poll-name">Python</span>
                <div class="poll-bar-track">
                    <div class="poll-bar-fill" style="width: 0%"></div>
                </div>
                <span class="poll-stats">0.0% (0 phiếu)</span>
            </div>

            <div class="poll-item" data-lang="Java">
                <span class="poll-name">Java</span>
                <div class="poll-bar-track">
                    <div class="poll-bar-fill" style="width: 0%"></div>
                </div>
                <span class="poll-stats">0.0% (0 phiếu)</span>
            </div>

            <div class="poll-item" data-lang="C++">
                <span class="poll-name">C++</span>
                <div class="poll-bar-track">
                    <div class="poll-bar-fill" style="width: 0%"></div>
                </div>
                <span class="poll-stats">0.0% (0 phiếu)</span>
            </div>
        </div>
    </div>
