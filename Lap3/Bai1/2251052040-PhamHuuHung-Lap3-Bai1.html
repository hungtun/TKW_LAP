<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính chỉ số BMI</title>
    <link rel="stylesheet" href="2251052040-PhamHuuHung-Lap3-Bai1.css">
</head>

<body>
    <div class="card">
        <h1>Tính chỉ số BMI</h1>

        <div class="form-row">
            <label for="weight">Cân nặng</label>
            <input type="number" id="weight" step="0.1" min="0">
            <span class="unit">(kg)</span>
        </div>

        <div class="form-row">
            <label for="height">Chiều cao</label>
            <input type="number" id="height" step="0.01" min="0">
            <span class="unit">(m)</span>
        </div>

        <p id="error-msg" class="error-msg"></p>
        <p id="result" class="result"></p>

        <button type="button" id="btn-calc">Tính</button>
    </div>

    <script src="2251052040-PhamHuuHung-Lap3-Bai1.js"></script>
</body>

</html>
