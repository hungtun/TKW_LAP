<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống thông báo</title>
    <link rel="stylesheet" href="2251052040-PhamHuuHung-Lap4-Bai5.css">
</head>

<body>
    <div class="toast-box" id="toast-box"></div>

    <div class="panel">
        <h1>🔔 Hệ thống thông báo</h1>
        <div class="buttons">
            <button type="button" class="btn success" onclick="showToast('success')">Thành công</button>
            <button type="button" class="btn warning" onclick="showToast('warning')">Cảnh báo</button>
            <button type="button" class="btn error" onclick="showToast('error')">Lỗi</button>
            <button type="button" class="btn info" onclick="showToast('info')">Thông tin</button>
        </div>
    </div>

    <script src="2251052040-PhamHuuHung-Lap4-Bai5.js"></script>
</body>

</html>
