<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <link rel="stylesheet" href="2251052040-PhamHuuHung-Lap4-Bai7.css">
</head>

<body>
    <div class="carousel">
        <div class="viewport">
            <div class="track" id="track">
                <img src="images/flower1.jpg" alt="Flower 1">
                <img src="images/flower2.jpg" alt="Flower 2">
                <img src="images/flower3.jpg" alt="Flower 3">
                <img src="images/flower4.jpg" alt="Flower 4">
                <img src="images/flower5.jpg" alt="Flower 5">
                <img src="images/flower6.jpg" alt="Flower 6">
            </div>
        </div>

        <div class="controls">
            <button type="button" onclick="moveSlide(-1)">«</button>
            <span class="dot active" onclick="goPos(0)"></span>
            <span class="dot" onclick="goPos(1)"></span>
            <span class="dot" onclick="goPos(2)"></span>
            <span class="dot" onclick="goPos(3)"></span>
            <button type="button" onclick="moveSlide(1)">»</button>
        </div>
    </div>

    <script src="2251052040-PhamHuuHung-Lap4-Bai7.js"></script>
</body>

</html>
