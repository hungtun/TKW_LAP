<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <link rel="stylesheet" href="2251052040-PhamHuuHung-Lap4-Bai7.css">
</head>

<body>
    <div class="carousel">
        <div class="viewport">
            <div class="track" id="track">
                <img src="../images/images.jpg" alt="Image 1">
                <img src="../images/images (1).jpg" alt="Image 2">
                <img src="../images/images (2).jpg" alt="Image 3">
                <img src="../images/images (3).jpg" alt="Image 4">
                <img src="../images/images (4).jpg" alt="Image 5">
                <img src="../images/png-transparent-mythical-phoenix-watercolor-resplendent-flaming-phoenix-bird-thumbnail.png" alt="Image 6">
                <img src="../images/category1.jpg" alt="Image 7">
                <img src="../images/cpp.png" alt="Image 8">
                <img src="../images/database.png" alt="Image 9">
            </div>
        </div>

        <div class="controls">
            <button type="button" onclick="moveSlide(-1)">«</button>
            <span class="dot active" onclick="goPos(0)"></span>
            <span class="dot" onclick="goPos(1)"></span>
            <span class="dot" onclick="goPos(2)"></span>
            <button type="button" onclick="moveSlide(1)">»</button>
        </div>
    </div>

    <script src="2251052040-PhamHuuHung-Lap4-Bai7.js"></script>
</body>

</html>
