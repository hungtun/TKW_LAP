<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="2251052040-PhamHuuHung-Lap4-Bai4.css">
</head>

<body>
    <div class="slider" id="slider">
        <img src="images/banner1.jpg" class="slide active" alt="Banner 1">
        <img src="images/banner2.jpg" class="slide" alt="Banner 2">
        <img src="images/banner3.jpg" class="slide" alt="Banner 3">
        <img src="images/banner4.jpg" class="slide" alt="Banner 4">
        <img src="images/banner5.jpg" class="slide" alt="Banner 5">
        <img src="images/banner6.jpg" class="slide" alt="Banner 6">

        <div class="nav">
            <button type="button" onclick="changeSlide(-1)">«</button>
            <button type="button" class="num active" onclick="goSlide(0)">1</button>
            <button type="button" class="num" onclick="goSlide(1)">2</button>
            <button type="button" class="num" onclick="goSlide(2)">3</button>
            <button type="button" class="num" onclick="goSlide(3)">4</button>
            <button type="button" class="num" onclick="goSlide(4)">5</button>
            <button type="button" class="num" onclick="goSlide(5)">6</button>
            <button type="button" onclick="changeSlide(1)">»</button>
        </div>
    </div>

    <script src="2251052040-PhamHuuHung-Lap4-Bai4.js"></script>
</body>

</html>
